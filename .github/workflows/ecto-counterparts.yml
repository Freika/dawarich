name: Ecto counterparts

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ecto-counterparts-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ecto-counterparts:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev
          sudo locale-gen en_US.UTF-8

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27.3.4.1"
          elixir-version: "1.18.3"
          version-type: strict

      - name: Cache Mix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app-phoenix/deps
            app-phoenix/_build
          key: mix-${{ runner.os }}-${{ hashFiles('app-phoenix/mix.lock') }}

      - name: Fetch Elixir dependencies
        working-directory: app-phoenix
        run: mix deps.get

      - name: Select the checks this change must pass
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scripts/schema_parity/ecto_prove.sh --list > "$RUNNER_TEMP/list.txt"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git cat-file -e "$BASE_SHA^{commit}" || { echo "base commit '$BASE_SHA' is not in the checkout"; exit 1; }
            git diff --no-renames --name-only "$BASE_SHA"...HEAD \
              | ruby scripts/schema_parity/pr_checks.rb "$RUNNER_TEMP/list.txt" "$BASE_SHA...HEAD" > "$RUNNER_TEMP/checks.txt"
          else
            ruby scripts/schema_parity/pr_checks.rb "$RUNNER_TEMP/list.txt" < /dev/null > /dev/null
            cp "$RUNNER_TEMP/list.txt" "$RUNNER_TEMP/checks.txt"
          fi
          cat "$RUNNER_TEMP/checks.txt"
          root="$PWD"
          tmpd="$RUNNER_TEMP"
          . scripts/schema_parity/lib.sh
          . scripts/schema_parity/ecto_lib.sh
          key="$(code_key)"
          echo "code-key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache the Rails references
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/schema_parity/ecto/ref
            tmp/schema_parity/canon
          key: ecto-ref-${{ runner.os }}-${{ steps.select.outputs.code-key }}

      - name: Start the scratch databases
        run: scripts/schema_parity/infra.sh up

      - name: Prove the fresh install and every migration this change touches
        shell: bash
        run: |
          rm -f tmp/schema_parity/ecto/summary*.txt
          scripts/schema_parity/ecto_prove.sh --jobs 2 $(cat "$RUNNER_TEMP/checks.txt")
          cut -d ' ' -f 1 tmp/schema_parity/ecto/summary.txt | cmp - "$RUNNER_TEMP/checks.txt"
          if grep -Ev '^[^ ]+ ok( \(.+\))?$' tmp/schema_parity/ecto/summary.txt; then exit 1; fi

      - name: Upload proof diffs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecto-proof
          path: |
            tmp/schema_parity/ecto/
            !tmp/schema_parity/ecto/ref/

  ecto-upgrade-sample:
    name: upgrade sample pg${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 17]

    env:
      LANG: en_US.UTF-8
      MIX_ENV: test
      SP_PG_MAJOR: ${{ matrix.pg }}
      REF_CACHE_FORMAT: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev
          sudo locale-gen en_US.UTF-8

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27.3.4.1"
          elixir-version: "1.18.3"
          version-type: strict

      - name: Cache Mix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app-phoenix/deps
            app-phoenix/_build
          key: mix-${{ runner.os }}-${{ hashFiles('app-phoenix/mix.lock') }}

      - name: Fetch Elixir dependencies
        working-directory: app-phoenix
        run: mix deps.get

      - name: Select the upgrade sample
        id: select
        run: |
          scripts/schema_parity/ecto_prove.sh --list > "$RUNNER_TEMP/list.txt"
          ruby scripts/schema_parity/ci/upgrade_sample.rb "$RUNNER_TEMP/list.txt" > "$RUNNER_TEMP/sample.txt"
          cat "$RUNNER_TEMP/sample.txt"
          inputs="$(scripts/schema_parity/ci/ref_cache_key.sh)"
          week="$(date -u +%G-W%V)"
          prefix="ecto-ref-sample-v$REF_CACHE_FORMAT-$RUNNER_OS-${ImageOS:-no-image}-$week"
          echo "key=$prefix-pg$SP_PG_MAJOR-$inputs" >> "$GITHUB_OUTPUT"

      - name: Restore the Rails references
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/schema_parity/ecto/ref
          key: ${{ steps.select.outputs.key }}

      - name: Start PostgreSQL ${{ matrix.pg }} and Redis
        run: scripts/schema_parity/infra.sh up

      - name: Prove the upgrade sample on PostgreSQL ${{ matrix.pg }}
        id: prove
        run: exec scripts/schema_parity/ci/prove_shard.sh $(cat "$RUNNER_TEMP/sample.txt")

      - name: Compare the summary with the sample
        id: verify
        if: always()
        run: |
          ruby scripts/schema_parity/ci/nightly_report.rb leg tmp/schema_parity
          cmp "$RUNNER_TEMP/sample.txt" tmp/schema_parity/nightly/list.txt
          if grep -F 'unported@' tmp/schema_parity/ecto/summary.txt; then
            echo "the upgrade sample allows no unported effect"
            exit 1
          fi

      - name: Save the Rails references
        if: steps.prove.outcome == 'success' && steps.verify.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/schema_parity/ecto/ref
          key: ${{ steps.select.outputs.key }}

      - name: Upload the sample's evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-sample-pg${{ matrix.pg }}
          overwrite: true
          path: |
            tmp/schema_parity/nightly/
            tmp/schema_parity/ecto/summary.txt
            tmp/schema_parity/ecto/prove.log
            tmp/schema_parity/ecto/diffs/

  harness-tests:
    name: harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0

      - name: TERM paths of ecto_prove.sh
        run: sh scripts/schema_parity/test/prove_term.sh

      - name: Nightly shard wrapper
        run: sh scripts/schema_parity/test/prove_shard.sh

      - name: Nightly report
        run: sh scripts/schema_parity/test/nightly_report.sh

      - name: Nightly workflow structure
        run: ruby scripts/schema_parity/test/nightly_workflow.rb

      - name: Counterparts workflow structure
        run: ruby scripts/schema_parity/test/counterparts_workflow.rb

      - name: Matrix inventory preflight
        run: sh scripts/schema_parity/test/matrix_inventory_preflight.sh

      - name: Upgrade sample selector
        run: sh scripts/schema_parity/test/upgrade_sample.sh

      - name: Pull request check selection
        run: sh scripts/schema_parity/test/pr_checks.sh

  harness-docker-tests:
    name: harness tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0

      - name: PostgreSQL major selection and PostgreSQL 14 restores
        run: sh scripts/schema_parity/test/pg_major.sh
