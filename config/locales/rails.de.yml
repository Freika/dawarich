de:
  activerecord:
    errors:
      messages:
        record_invalid: 'Gültigkeitsprüfung ist fehlgeschlagen: %{errors}'
        restrict_dependent_destroy:
          has_one: Datensatz kann nicht gelöscht werden, da ein abhängiger %{record}-Datensatz existiert.
          has_many: Datensatz kann nicht gelöscht werden, da abhängige %{record} existieren.
  datetime:
    distance_in_words:
      about_x_hours:
        one: etwa eine Stunde
        other: etwa %{count} Stunden
      about_x_months:
        one: etwa ein Monat
        other: etwa %{count} Monate
      about_x_years:
        one: etwa ein Jahr
        other: etwa %{count} Jahre
      almost_x_years:
        one: fast ein Jahr
        other: fast %{count} Jahre
      half_a_minute: eine halbe Minute
      less_than_x_seconds:
        one: weniger als eine Sekunde
        other: weniger als %{count} Sekunden
      less_than_x_minutes:
        one: weniger als eine Minute
        other: weniger als %{count} Minuten
      over_x_years:
        one: mehr als ein Jahr
        other: mehr als %{count} Jahre
      x_seconds:
        one: eine Sekunde
        other: '%{count} Sekunden'
      x_minutes:
        one: eine Minute
        other: '%{count} Minuten'
      x_days:
        one: ein Tag
        other: '%{count} Tage'
      x_months:
        one: ein Monat
        other: '%{count} Monate'
      x_years:
        one: ein Jahr
        other: '%{count} Jahre'
      dative:
        about_x_hours:
          one: etwa einer Stunde
          other: etwa %{count} Stunden
        about_x_months:
          one: etwa einem Monat
          other: etwa %{count} Monaten
        about_x_years:
          one: etwa einem Jahr
          other: etwa %{count} Jahren
        almost_x_years:
          one: fast einem Jahr
          other: fast %{count} Jahren
        half_a_minute: einer halben Minute
        less_than_x_seconds:
          one: weniger als einer Sekunde
          other: weniger als %{count} Sekunden
        less_than_x_minutes:
          one: weniger als einer Minute
          other: weniger als %{count} Minuten
        over_x_years:
          one: mehr als einem Jahr
          other: mehr als %{count} Jahren
        x_seconds:
          one: einer Sekunde
          other: '%{count} Sekunden'
        x_minutes:
          one: einer Minute
          other: '%{count} Minuten'
        x_days:
          one: einem Tag
          other: '%{count} Tagen'
        x_months:
          one: einem Monat
          other: '%{count} Monaten'
        x_years:
          one: einem Jahr
          other: '%{count} Jahren'
    prompts:
      second: Sekunde
      minute: Minute
      hour: Stunde
      day: Tag
      month: Monat
      year: Jahr
    relative:
      future: 'in %{time}'
      past: 'vor %{time}'
  errors:
    format: '%{attribute} %{message}'
    messages:
      accepted: muss akzeptiert werden
      blank: muss ausgefüllt werden
      confirmation: stimmt nicht mit %{attribute} überein
      empty: muss ausgefüllt werden
      equal_to: muss genau %{count} sein
      even: muss gerade sein
      exclusion: ist nicht verfügbar
      greater_than: muss größer als %{count} sein
      greater_than_or_equal_to: muss größer oder gleich %{count} sein
      in: muss in %{count} enthalten sein
      inclusion: ist kein gültiger Wert
      invalid: ist nicht gültig
      less_than: muss kleiner als %{count} sein
      less_than_or_equal_to: muss kleiner oder gleich %{count} sein
      model_invalid: 'Gültigkeitsprüfung ist fehlgeschlagen: %{errors}'
      not_a_number: ist keine Zahl
      not_an_integer: muss ganzzahlig sein
      odd: muss ungerade sein
      other_than: darf nicht gleich %{count} sein
      password_too_long: ist zu lang
      present: darf nicht ausgefüllt werden
      required: muss ausgefüllt werden
      taken: ist bereits vergeben
      too_long:
        one: ist zu lang (mehr als %{count} Zeichen)
        other: ist zu lang (mehr als %{count} Zeichen)
      too_short:
        one: ist zu kurz (weniger als %{count} Zeichen)
        other: ist zu kurz (weniger als %{count} Zeichen)
      wrong_length:
        one: hat die falsche Länge (muss genau %{count} Zeichen haben)
        other: hat die falsche Länge (muss genau %{count} Zeichen haben)
    template:
      body: 'Bitte überprüfe die folgenden Felder:'
      header:
        one: 'Konnte %{model} nicht speichern: ein Fehler.'
        other: 'Konnte %{model} nicht speichern: %{count} Fehler.'
  helpers:
    select:
      prompt: Bitte auswählen
    submit:
      create: '%{model} erstellen'
      submit: '%{model} speichern'
      update: '%{model} aktualisieren'
  number:
    currency:
      format:
        delimiter: '.'
        format: '%n %u'
        precision: 2
        separator: ','
        significant: false
        strip_insignificant_zeros: false
        unit: €
    format:
      delimiter: '.'
      precision: 2
      round_mode: default
      separator: ','
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: '%n %u'
        units:
          billion:
            one: Milliarde
            other: Milliarden
          million:
            one: Million
            other: Millionen
          quadrillion:
            one: Billiarde
            other: Billiarden
          thousand: Tausend
          trillion:
            one: Billion
            other: Billionen
          unit: ''
      format:
        delimiter: ''
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: '%n %u'
        units:
          byte:
            one: Byte
            other: Bytes
          eb: EB
          gb: GB
          kb: KB
          mb: MB
          pb: PB
          tb: TB
    percentage:
      format:
        delimiter: ''
        format: '%n %'
    precision:
      format:
        delimiter: ''
  support:
    array:
      last_word_connector: ' und '
      two_words_connector: ' und '
      words_connector: ', '
