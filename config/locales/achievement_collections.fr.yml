      rules:
        return: Une visite d’au moins 20 minutes après une interruption de 1, 3 ou
          5 années calendaires depuis la visite admissible précédente débloque un
          palier. Ces interruptions décrivent votre historique sauvegardé ; l’absence
          d’enregistrement ne prouve pas votre absence.
        seasons: Collectionnez quatre visites distinctes d’au moins 20 minutes, une
          par saison calendaire. Elles peuvent provenir d’années différentes et doivent
          commencer à au moins sept jours d’intervalle. Sous les tropiques, les quatre
          périodes portent les noms des mois. Le fuseau horaire du lieu s’applique.
        city: Les paliers se débloquent à 1%, 5%, 10% et 25% de la surface terrestre
          administrative. Un point enregistré non anormal ouvre une cellule H3 de
          résolution 9, sauf pendant un vol reconnu. L’eau est exclue. Ce pourcentage
          mesure la surface des cellules ouvertes, pas les rues parcourues ; atteindre
          100% n’est pas requis. La carte et la carte de collection utilisent le même
          instantané publié.
        park: Enregistrez 30 minutes observées dans les limites du parc en une journée
          locale. Les points consécutifs doivent être espacés d’au plus dix minutes ; le temps qui les sépare est compté. Les appareils qui se chevauchent
          comptent une seule fois. Le déplacement est autorisé ; vols et anomalies
          sont exclus.
        parks: Les paliers se débloquent après 1, 5 et 15 parcs nationaux différents
          du catalogue remplissant les conditions. Chaque parc nécessite 30 minutes
          observées en une journée locale. Le catalogue régional est incomplet et
          versionné ; chaque parc conserve une identité stable.
        milestone: Enregistrez au moins dix minutes observées par région requise en
          une journée locale. Les paires de points sont espacées d’au plus dix minutes, et le temps qui les sépare est compté ; les appareils qui se chevauchent
          comptent une fois. Vols et anomalies sont exclus. Une marge de 10 km exclut
          l’équateur, les méridiens 0° et 180° et le parallèle polaire fixé pour le
          jeu à 66,56°. Cela atteste une présence de chaque côté, pas une traversée
          prouvée.
