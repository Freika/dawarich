ca:
  activerecord:
    errors:
      messages:
        record_invalid: 'La validació ha fallat: %{errors}'
        restrict_dependent_destroy:
          has_one: No es pot eliminar el registre perquè existeix un %{record} dependent
          has_many: No es pot eliminar el registre perquè existeixen %{record} dependents
  date:
    abbr_day_names:
    - dg.
    - dl.
    - dt.
    - dc.
    - dj.
    - dv.
    - ds.
    abbr_month_names:
    -
    - gen.
    - febr.
    - març
    - abr.
    - maig
    - juny
    - jul.
    - ag.
    - set.
    - oct.
    - nov.
    - des.
    day_names:
    - diumenge
    - dilluns
    - dimarts
    - dimecres
    - dijous
    - divendres
    - dissabte
    formats:
      default: "%d/%m/%Y"
      long: "%-d de %B de %Y"
      short: "%-d de %b"
    month_names:
    -
    - gener
    - febrer
    - març
    - abril
    - maig
    - juny
    - juliol
    - agost
    - setembre
    - octubre
    - novembre
    - desembre
    order:
    - day
    - month
    - year
  datetime:
    distance_in_words:
      about_x_hours:
        one: aproximadament una hora
        other: aproximadament %{count} hores
      about_x_months:
        one: aproximadament un mes
        other: aproximadament %{count} mesos
      about_x_years:
        one: aproximadament un any
        other: aproximadament %{count} anys
      almost_x_years:
        one: gairebé un any
        other: gairebé %{count} anys
      half_a_minute: mig minut
      less_than_x_seconds:
        one: menys d'un segon
        other: menys de %{count} segons
      less_than_x_minutes:
        one: menys d'un minut
        other: menys de %{count} minuts
      over_x_years:
        one: més d'un any
        other: més de %{count} anys
      x_seconds:
        one: "1 segon"
        other: "%{count} segons"
      x_minutes:
        one: "1 minut"
        other: "%{count} minuts"
      x_days:
        one: "1 dia"
        other: "%{count} dies"
      x_months:
        one: "1 mes"
        other: "%{count} mesos"
      x_years:
        one: "1 any"
        other: "%{count} anys"
    prompts:
      second: Segon
      minute: Minut
      hour: Hora
      day: Dia
      month: Mes
      year: Any
    relative:
      future: "d'aquí a %{time}"
      past: "fa %{time}"
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: s'ha d'acceptar
      blank: no pot estar en blanc
      confirmation: no coincideix
      empty: no pot estar buit
      equal_to: ha de ser igual a %{count}
      even: ha de ser parell
      exclusion: està reservat
      greater_than: ha de ser més gran que %{count}
      greater_than_or_equal_to: ha de ser més gran o igual que %{count}
      in: ha d'estar entre %{count}
      inclusion: no està inclòs a la llista
      invalid: no és vàlid
      less_than: ha de ser més petit que %{count}
      less_than_or_equal_to: ha de ser més petit o igual que %{count}
      model_invalid: 'La validació ha fallat: %{errors}'
      not_a_number: no és un número
      not_an_integer: ha de ser un enter
      odd: ha de ser senar
      other_than: ha de ser diferent de %{count}
      password_too_long: és massa llarga
      present: ha d'estar en blanc
      required: ha d'existir
      taken: ja està en ús
      too_long:
        one: és massa llarg (màxim %{count} caràcter)
        other: és massa llarg (màxim %{count} caràcters)
      too_short:
        one: és massa curt (mínim %{count} caràcter)
        other: és massa curt (mínim %{count} caràcters)
      wrong_length:
        one: no té la longitud correcta (%{count} caràcter exacte)
        other: no té la longitud correcta (%{count} caràcters exactes)
    template:
      body: 'S''han trobat problemes amb els camps següents:'
      header:
        one: No s'ha pogut desar aquest/a %{model} perquè s'ha trobat %{count} error
        other: No s'ha pogut desar aquest/a %{model} perquè s'han trobat %{count} errors
  helpers:
    select:
      prompt: Si us plau, selecciona
    submit:
      create: Crea %{model}
      submit: Desa %{model}
      update: Actualitza %{model}
  number:
    currency:
      format:
        delimiter: "."
        format: "%n %u"
        negative_format: "-%n %u"
        precision: 2
        separator: ","
        significant: false
        strip_insignificant_zeros: false
        unit: "€"
    format:
      delimiter: "."
      precision: 3
      round_mode: default
      separator: ","
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion: mil milions
          million:
            one: milió
            other: milions
          quadrillion: mil bilions
          thousand: mil
          trillion:
            one: bilió
            other: bilions
          unit: ''
      format:
        delimiter: ''
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: Byte
            other: Bytes
          eb: EB
          gb: GB
          kb: KB
          mb: MB
          pb: PB
          tb: TB
          zb: ZB
    percentage:
      format:
        delimiter: ''
        format: "%n %"
    precision:
      format:
        delimiter: ''
  support:
    array:
      last_word_connector: " i "
      two_words_connector: " i "
      words_connector: ", "
  time:
    am: am
    formats:
      default: "%A, %-d de %B de %Y %H:%M:%S %z"
      long: "%-d de %B de %Y %H:%M"
      short: "%-d de %b %H:%M"
    pm: pm
