      rules:
        return: Una visita de al menos 20 minutos tras un intervalo de 1, 3 o 5 años
          naturales desde la anterior visita válida otorga un nivel. Los intervalos
          describen el historial guardado; la falta de registros no demuestra ausencia.
        seasons: Reúne cuatro visitas distintas de al menos 20 minutos, una por estación
          del calendario. Pueden ser de años diferentes y deben comenzar con al menos
          siete días de separación. En los trópicos, los cuatro períodos se nombran
          por meses. Se usa la zona horaria del lugar.
        city: Los niveles se desbloquean al 1%, 5%, 10% y 25% del área terrestre administrativa
          de la ciudad. Un punto registrado no anómalo abre una celda H3 de resolución
          9, salvo durante un vuelo reconocido. Se excluye el agua. El porcentaje
          mide área de celdas abiertas, no calles recorridas; no se exige llegar al
          100%. El mapa y la tarjeta usan la misma instantánea publicada.
        park: Registra 30 minutos observados dentro del límite del parque en un día
          local. Los puntos consecutivos deben estar separados como máximo diez minutos
          y aportan hasta dos minutos por pareja. Los dispositivos solapados cuentan
          una sola vez. Se permite moverse; se excluyen vuelos y anomalías.
        parks: Los niveles se desbloquean tras 1, 5 y 15 parques nacionales distintos
          del catálogo que cumplan las condiciones. Cada parque requiere 30 minutos
          observados en un día local. El catálogo regional es incompleto y versionado;
          cada parque mantiene una identidad estable.
        milestone: Registra al menos diez minutos observados por región necesaria
          en un día local. Las parejas de puntos deben distar como máximo diez minutos
          y aportan hasta dos; los dispositivos solapados cuentan una vez. Se excluyen
          vuelos y anomalías. Un margen de 10 km excluye el ecuador, los meridianos
          0° y 180° y el paralelo polar fijado para el juego en 66,56°. Se registra
          presencia a cada lado, no un cruce demostrado.
