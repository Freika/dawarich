      description:
        return: Kehre nach einer langen Lücke in deinen aufgezeichneten Besuchen an
          einen Ort zurück.
        seasons: Besuche denselben Ort zu verschiedenen Jahreszeiten.
        city: Öffne das Land der Stadt, eine aufgezeichnete H3-Zelle nach der anderen.
        park: Verbringe Zeit innerhalb eines Nationalparks.
        parks: Sammle Besuche in verschiedenen Nationalparks.
        milestone: Zeichne Zeit in verschiedenen Teilen der Welt auf.
      rules:
        return: Ein Besuch von mindestens 20 Minuten nach einer Lücke von 1, 3 oder
          5 Kalenderjahren seit dem vorherigen gültigen Besuch schaltet eine Stufe
          frei. Lücken beschreiben den gespeicherten Verlauf; fehlende Aufzeichnungen
          beweisen keine Abwesenheit.
        seasons: Sammle vier getrennte Besuche von mindestens 20 Minuten, je einen
          pro Kalenderjahreszeit. Die Besuche dürfen aus verschiedenen Jahren stammen
          und müssen mindestens sieben Tage auseinander beginnen. In den Tropen werden
          die vier Abschnitte nach Monaten benannt. Es gilt die Zeitzone des Ortes.
        city: Stufen werden bei 1%, 5%, 10% und 25% der administrativen Landfläche
          freigeschaltet. Ein aufgezeichneter, nicht anomaler Punkt öffnet eine H3-Zelle
          der Auflösung 9, außer während eines erkannten Fluges. Wasser ist ausgeschlossen.
          Der Prozentwert misst geöffnete Zellfläche, keine gelaufenen Straßen; 100%
          sind kein erforderliches Ziel. Karte und Stadt-Karte verwenden denselben
          veröffentlichten Erkundungsstand.
        park: Zeichne innerhalb der Parkgrenze 30 beobachtete Minuten an einem lokalen
          Tag auf. Aufeinanderfolgende Punkte dürfen höchstens zehn Minuten auseinanderliegen
          und zählen je Paar höchstens zwei Minuten. Überlappende Geräte zählen einmal.
          Bewegung ist erlaubt; Flüge und Anomalien sind ausgeschlossen.
        parks: Stufen werden nach 1, 5 und 15 verschiedenen gültigen Nationalparks
          aus dem Katalog freigeschaltet. Jeder Park benötigt 30 beobachtete Minuten
          an einem lokalen Tag. Der regionale Katalog ist unvollständig und versioniert;
          jeder Park behält eine stabile Identität.
        milestone: Zeichne pro benötigtem Gebiet mindestens zehn beobachtete Minuten
          an einem lokalen Tag auf. Punktpaare dürfen höchstens zehn Minuten auseinanderliegen
          und zählen höchstens zwei Minuten; überlappende Geräte zählen einmal. Flüge
          und Anomalien sind ausgeschlossen. Ein Abstand von 10 km gilt zum Äquator,
          den Meridianen 0° und 180° sowie zum festen Spiel-Polarkreis bei 66,56°.
          Erfasst wird Anwesenheit auf jeder Seite, keine nachgewiesene Überquerung.
