      rules:
        return: Een bezoek van minstens 20 minuten na een onderbreking van 1, 3 of 5 kalenderjaren sinds het vorige
          kwalificerende bezoek levert een niveau op. Onderbrekingen beschrijven je opgeslagen geschiedenis;
          ontbrekende registraties kunnen niet bewijzen dat je weg was.
        seasons: Verzamel vier afzonderlijke bezoeken van minstens 20 minuten, één in elk kalenderseizoen.
          Bezoeken mogen uit verschillende jaren komen en moeten minstens zeven dagen uit elkaar beginnen.
          In de tropen worden de vier delen aangeduid met maanden. Seizoenen gebruiken de tijdzone van de plaats.
        city: Niveaus worden ontgrendeld bij 1%, 5%, 10% en 25% van het administratieve landgebied van de stad.
          Een geregistreerd, niet-afwijkend punt opent een H3-cel met resolutie 9, behalve tijdens een herkende vlucht.
          Water is uitgesloten. Dit percentage meet het geopende celoppervlak, niet de gelopen straten; een doel
          van 100% is niet vereist. De kaart en de kaartweergave gebruiken dezelfde gepubliceerde verkenningsmomentopname.
        park: Registreer 30 waargenomen minuten binnen de parkgrens op één lokale dag.
          Opeenvolgende punten mogen maximaal 10 minuten uit elkaar liggen; de tijd ertussen telt mee.
          Overlappende apparaten tellen één keer. Beweging is toegestaan; vluchten en afwijkingen zijn uitgesloten.
        parks: Niveaus worden ontgrendeld na 1, 5 en 15 verschillende kwalificerende nationale parken uit de catalogus.
          Elk park vereist 30 waargenomen minuten op één lokale dag.
          De regionale catalogus is onvolledig en versiegebonden; elk park behoudt een stabiele identiteit.
        milestone: Registreer minstens 10 waargenomen minuten per vereiste regio op één lokale dag. Puntenparen mogen
          maximaal 10 minuten uit elkaar liggen, en de tijd ertussen telt mee; overlappende apparaten tellen één keer.
          Vluchten en afwijkingen zijn uitgesloten. Een marge van 10 km sluit de evenaar, de meridianen 0° en 180° en
          de poolparallel op de vaste spellatitude van 66,56° uit. Dit registreert aanwezigheid aan elke zijde,
          geen bewezen oversteek.
