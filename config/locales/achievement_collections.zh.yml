      rules:
        return: 自上一次有效到访结束后，相隔 1、3 或 5 个日历年，再次到访至少 20 分钟可获得相应等级。间隔仅描述已保存的历史；没有记录并不能证明你不在此地。
        seasons: 收集四次独立到访，每次至少 20 分钟，每个日历季节各一次。到访可以来自不同年份，开始日期之间必须至少相隔七天。热带地区的四个时段以月份命名。计算采用地点的当地时区。
        city: 开启城市行政陆地面积的 1%、5%、10% 和 25% 时解锁等级。一个非异常记录点可开启分辨率 9 的 H3 网格，但已识别的飞行除外。水域不计入。百分比表示已开启网格的陆地面积，而非走过的街道；无需达到
          100%。地图和卡片使用同一已发布的探索快照。
        park: 在同一个当地日期内，在公园边界内记录 30 分钟观测时间。相邻点间隔不能超过十分钟，其间时间全部计入。多个设备的重叠时间只计一次。移动中也可计入；飞行和异常点除外。
        parks: 有效到访目录中 1、5 和 15 个不同国家公园时解锁等级。每个公园都需要在同一个当地日期内观测 30 分钟。区域目录并不完整，使用版本管理；每个公园保留稳定标识。
        milestone: 在每个所需区域内，于同一个当地日期记录至少十分钟观测时间。点对间隔不能超过十分钟，其间时间全部计入；多个设备的重叠时间只计一次。飞行和异常点除外。赤道、0°
          和 180° 经线及游戏固定的 66.56° 极圈纬线周围各排除 10 公里。此成就表示曾在两侧停留，不证明实际穿越。
