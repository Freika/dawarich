      rules:
        return: Una visita d’almenys 20 minuts després d’un interval d’1, 3 o 5 anys
          naturals des de la visita vàlida anterior atorga un nivell. Els intervals
          descriuen l’historial desat; la manca de registres no demostra absència.
        seasons: Reuneix quatre visites separades d’almenys 20 minuts, una per estació
          del calendari. Poden ser d’anys diferents i han de començar amb almenys
          set dies de separació. Als tròpics, els quatre períodes s’anomenen per mesos.
          S’utilitza el fus horari del lloc.
        city: Els nivells es desbloquegen a l’1%, 5%, 10% i 25% de l’àrea terrestre
          administrativa. Un punt enregistrat no anòmal obre una cel·la H3 de resolució
          9, excepte durant un vol reconegut. S’exclou l’aigua. El percentatge mesura
          l’àrea de cel·les obertes, no els carrers recorreguts; no cal arribar al
          100%. El mapa i la targeta utilitzen la mateixa instantània publicada.
        park: Enregistra 30 minuts observats dins del parc en un dia local. Els punts
          consecutius han d’estar separats com a màxim deu minuts; el temps entre ells compta. Els dispositius superposats compten una vegada.
          Es permet el moviment; s’exclouen vols i anomalies.
        parks: Els nivells es desbloquegen després d’1, 5 i 15 parcs nacionals diferents
          del catàleg que compleixin els requisits. Cada parc necessita 30 minuts
          observats en un dia local. El catàleg regional és incomplet i versionat;
          cada parc conserva una identitat estable.
        milestone: Enregistra almenys deu minuts observats per regió requerida en
          un dia local. Les parelles de punts han de distar com a màxim deu minuts, i el temps entre ells compta; els dispositius superposats compten una vegada. S’exclouen
          vols i anomalies. Un marge de 10 km exclou l’equador, els meridians 0° i
          180° i el paral·lel polar fixat per al joc a 66,56°. Es registra presència
          a cada costat, no un encreuament demostrat.
