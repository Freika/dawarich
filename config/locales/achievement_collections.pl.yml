      rules:
        return: Wizyta trwająca co najmniej 20 minut po przerwie 1, 3 lub 5 lat kalendarzowych
          od poprzedniej kwalifikującej wizyty daje poziom. Przerwy opisują zapisane
          dane; brak zapisów nie dowodzi nieobecności.
        seasons: Zbierz cztery oddzielne wizyty trwające co najmniej 20 minut, po
          jednej w każdej kalendarzowej porze roku. Mogą pochodzić z różnych lat,
          a ich początki muszą dzielić co najmniej siedem dni. W tropikach cztery
          okresy noszą nazwy miesięcy. Obowiązuje strefa czasowa miejsca.
        city: Poziomy odblokowują się przy 1%, 5%, 10% i 25% administracyjnej powierzchni
          lądu miasta. Zapisany punkt bez anomalii otwiera komórkę H3 rozdzielczości
          9, z wyjątkiem rozpoznanego lotu. Woda jest wykluczona. Procent oznacza
          powierzchnię otwartych komórek, nie przebytych ulic; 100% nie jest wymagane.
          Mapa i karta używają tego samego opublikowanego stanu odkryć.
        park: Zapisz 30 zaobserwowanych minut w granicach parku w jednym lokalnym
          dniu. Kolejne punkty muszą dzielić najwyżej dziesięć minut; liczy się czas między nimi. Nakładające się urządzenia liczą się raz. Ruch jest
          dozwolony; loty i anomalie są wykluczone.
        parks: Poziomy odblokowują się po 1, 5 i 15 różnych kwalifikujących parkach
          narodowych z katalogu. Każdy wymaga 30 zaobserwowanych minut jednego lokalnego
          dnia. Katalog regionalny jest niepełny i wersjonowany; każdy park zachowuje
          stałą tożsamość.
        milestone: Zapisz co najmniej dziesięć zaobserwowanych minut w każdym wymaganym
          regionie jednego lokalnego dnia. Pary punktów dzieli najwyżej dziesięć minut, a czas między nimi się liczy; nakładające się urządzenia liczą się raz. Loty
          i anomalie są wykluczone. Margines 10 km wyklucza równik, południki 0° i
          180° oraz stały równoleżnik polarny gry 66,56°. To potwierdza obecność po
          każdej stronie, nie udowodnione przekroczenie.
