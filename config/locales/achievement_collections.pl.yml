      description:
        return: Wróć do miejsca po długiej przerwie w zapisanych wizytach.
        seasons: Odwiedzaj to samo miejsce o różnych porach roku.
        city: Odkrywaj ląd miasta, po jednej zapisanej komórce H3.
        park: Spędź czas na terenie parku narodowego.
        parks: Zbieraj wizyty w różnych parkach narodowych.
