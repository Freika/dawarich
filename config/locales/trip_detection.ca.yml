ca:
  trip_detection:
    # A Detected Trip's name: places (a city or up to three countries), then the month.
    name: "%{places}, %{month}"
    list_separator: ", "
    # The name used when no city or country is known.
    fallback_name: "Viatge, %{range}"
    formats:
      month_year: "%b %Y"
    # Date ranges. Each part is a strftime format localized by I18n.l (%b is the
    # abbreviated month name); the pattern joins the two dates.
    range:
      same_month:
        pattern: "%{start}–%{end}"
        start: "%-d"
        end: "%-d %b %Y"
      same_year:
        pattern: "%{start} – %{end}"
        start: "%-d %b"
        end: "%-d %b %Y"
      cross_year:
        pattern: "%{start} – %{end}"
        start: "%-d %b %Y"
        end: "%-d %b %Y"
    # In-app notifications about the Detected Trips a run created.
    notifications:
      one:
        title: "Viatge trobat: %{name}"
        content: "Dawarich ha trobat un viatge nou al teu historial. <a href=\"%{url}\">Obre el viatge</a>"
      many:
        title:
          one: "S'ha trobat %{count} viatge"
          other: "S'han trobat %{count} viatges"
        content: "Dawarich ha trobat viatges nous al teu historial. <a href=\"%{url}\">Mostra els viatges trobats automàticament</a>"
    # The Home periods on a Place's edit page. An empty date is an open end.
    homes:
      title: "Hi visc / hi vaig viure"
      help: "Un «Des de» buit vol dir des que se't va registrar aquí per primera vegada; un «Fins a» buit vol dir que encara hi vius."
      from: "Des de"
      until: "Fins a"
      save: "Desa"
      remove: "Elimina"
      add: "Afegeix un període"
      end_before_start: "«Fins a» no pot ser anterior a «Des de»."
