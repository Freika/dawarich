      description:
        return: Return to a place after a long gap in your recorded visits.
        seasons: Return to the same place at different times of year.
        city: Open the city's land, one recorded H3 cell at a time.
        park: Spend time inside a national park.
        parks: Collect visits to different national parks.
        milestone: Record time in different parts of the world.
      rules:
        return: A visit lasting at least 20 minutes after a gap of 1, 3 or 5 calendar
          years since the previous qualifying visit earns a level. Gaps describe your
          saved history; missing recordings cannot prove that you were away.
        seasons: Collect four separate visits lasting at least 20 minutes, one in
          each calendar season. Visits may be from different years and must start
          at least seven days apart. In the tropics the four parts are labelled by
          months. Seasons use the timezone of the place.
        city: Levels unlock at 1%, 5%, 10% and 25% of the city's administrative land
          area. A recorded non-anomalous point opens a resolution-9 H3 cell, except
          during a recognized flight. Water is excluded. This percentage measures
          opened cell area, not streets walked; no 100% goal is required. The map
          and card use the same published exploration snapshot.
        park: Record 30 observed minutes inside the park boundary in one local day.
          Consecutive points must be at most 10 minutes apart; the time between them counts. Overlapping devices count once. Movement is allowed;
          flights and anomalies are excluded.
        parks: Levels unlock after 1, 5 and 15 different qualifying national parks
          from the catalog. Each park requires 30 observed minutes in one local day.
          The regional catalog is incomplete and versioned; each park keeps a stable
          identity.
        milestone: Record at least 10 observed minutes per required region in one
          local day. Point pairs must be at most 10 minutes apart, and the time between them counts; overlapping devices count once. Flights and anomalies
          are excluded. A 10 km margin excludes the equator, meridians 0° and 180°,
          and the polar parallel at the fixed game latitude 66.56°. This records presence
          on each side, not a proven crossing.
