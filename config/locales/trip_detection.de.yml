de:
  trip_detection:
    # A Detected Trip's name: places (a city or up to three countries), then the month.
    name: "%{places}, %{month}"
    list_separator: ", "
    # The name used when no city or country is known.
    fallback_name: "Reise, %{range}"
    formats:
      month_year: "%b %Y"
    # Date ranges. Each part is a strftime format localized by I18n.l (%b is the
    # abbreviated month name); the pattern joins the two dates.
    range:
      same_month:
        pattern: "%{start}–%{end}"
        start: "%-d."
        end: "%-d. %b %Y"
      same_year:
        pattern: "%{start} – %{end}"
        start: "%-d. %b"
        end: "%-d. %b %Y"
      cross_year:
        pattern: "%{start} – %{end}"
        start: "%-d. %b %Y"
        end: "%-d. %b %Y"
    # In-app notifications about the Detected Trips a run created.
    notifications:
      one:
        title: "Reise gefunden: %{name}"
        content: "Dawarich hat in deinem Verlauf eine neue Reise gefunden. <a href=\"%{url}\">Reise öffnen</a>"
      many:
        title:
          one: "%{count} Reise gefunden"
          other: "%{count} Reisen gefunden"
        content: "Dawarich hat in deinem Verlauf neue Reisen gefunden. <a href=\"%{url}\">Automatisch gefundene Reisen ansehen</a>"
    # The Home periods on a Place's edit page. An empty date is an open end.
    homes:
      title: "Ich wohne / wohnte hier"
      help: "Ein leeres „Von“ heißt: seit du hier zum ersten Mal aufgezeichnet wurdest; ein leeres „Bis“ heißt: du wohnst noch hier."
      from: "Von"
      until: "Bis"
      save: "Speichern"
      remove: "Entfernen"
      add: "Zeitraum hinzufügen"
      end_before_start: "„Bis“ darf nicht vor „Von“ liegen."
    # The origin filter on the Trips list. Managed Trips count as created by the user.
    filter:
      label: "Anzeigen"
      all: "Alle Reisen"
      manual: "Von mir erstellt"
      detected: "Automatisch gefunden"
    # Hints on the Trips page; each ends with a link to the Places page.
    hints:
      no_home: "Füge dein Zuhause hinzu, damit Dawarich deine Reisen automatisch finden kann."
      long_absence: "Dawarich hat eine Zeit von mehr als %{days} Tagen außerhalb deines Zuhauses übersprungen. Wenn du damals woanders gewohnt hast, füge dieses frühere Zuhause hinzu."
      add_home: "Zuhause auf der Seite „Orte“ hinzufügen"
    # The name of the Place created for a Home picked in onboarding.
    home_place_name: "Zuhause"
    # The optional "Add your home" screen of the onboarding modal.
    onboarding:
      title: "Füge dein Zuhause hinzu"
      intro: "Dawarich nutzt dein Zuhause, um deine Reisen automatisch zu finden. Teile deinen Standort oder klicke auf die Karte und bestätige dann."
      use_my_location: "Meinen Standort verwenden"
      confirm: "Hier wohne ich"
      skip: "Überspringen"
      location_denied: "Dein Standort konnte nicht ermittelt werden. Klicke stattdessen auf die Karte, um dein Zuhause zu setzen, oder lege es später auf der Seite „Orte“ fest."
      home_saved: "Dein Zuhause ist gespeichert. Dawarich sucht jetzt nach deinen Reisen."
      invalid_location: "Wähle zuerst einen Ort auf der Karte."
      # Onboarding never adds a second Home.
      home_exists: "Du hast bereits ein Zuhause. Du kannst es auf der Seite „Orte“ ändern."
      # Leaves the import screen for the home step (or closes the modal).
      continue: "Weiter"
