en:
  trip_detection:
    # A Detected Trip's name: places (a city or up to three countries), then the month.
    name: "%{places}, %{month}"
    list_separator: ", "
    # The name used when no city or country is known.
    fallback_name: "Trip, %{range}"
    formats:
      month_year: "%b %Y"
    # Date ranges. Each part is a strftime format localized by I18n.l (%b is the
    # abbreviated month name); the pattern joins the two dates.
    range:
      same_month:
        pattern: "%{start}–%{end}"
        start: "%-d"
        end: "%-d %b %Y"
      same_year:
        pattern: "%{start} – %{end}"
        start: "%-d %b"
        end: "%-d %b %Y"
      cross_year:
        pattern: "%{start} – %{end}"
        start: "%-d %b %Y"
        end: "%-d %b %Y"
    # In-app notifications about the Detected Trips a run created.
    notifications:
      one:
        title: "Trip found: %{name}"
        content: "Dawarich found a new trip in your history. <a href=\"%{url}\">Open the trip</a>"
      many:
        title:
          one: "Found %{count} trip"
          other: "Found %{count} trips"
        content: "Dawarich found new trips in your history. <a href=\"%{url}\">See the trips found automatically</a>"
    # The Home periods on a Place's edit page. An empty date is an open end.
    homes:
      title: "I live / lived here"
      help: "An empty “From” means since you were first recorded here; an empty “Until” means you still live here."
      from: "From"
      until: "Until"
      save: "Save"
      remove: "Remove"
      add: "Add a period"
      end_before_start: "“Until” can't be before “From”."
