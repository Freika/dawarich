en:
  trip_detection:
    # A Detected Trip's name: places (a city or up to three countries), then the month.
    name: "%{places}, %{month}"
    list_separator: ", "
    # The name used when no city or country is known.
    fallback_name: "Trip, %{range}"
    formats:
      month_year: "%b %Y"
    # Date ranges. Each part is a strftime format localized by I18n.l (%b is the
    # abbreviated month name); the pattern joins the two dates.
    range:
      same_month:
        pattern: "%{start}–%{end}"
        start: "%-d"
        end: "%-d %b %Y"
      same_year:
        pattern: "%{start} – %{end}"
        start: "%-d %b"
        end: "%-d %b %Y"
      cross_year:
        pattern: "%{start} – %{end}"
        start: "%-d %b %Y"
        end: "%-d %b %Y"
    # In-app notifications about the Detected Trips a run created.
    notifications:
      one:
        title: "Trip found: %{name}"
        content: "Dawarich found a new trip in your history. <a href=\"%{url}\">Open the trip</a>"
      many:
        title:
          one: "Found %{count} trip"
          other: "Found %{count} trips"
        content: "Dawarich found new trips in your history. <a href=\"%{url}\">See the trips found automatically</a>"
    # The Home periods on a Place's edit page. An empty date is an open end.
    homes:
      title: "I live / lived here"
      help: "An empty “From” means since you were first recorded here; an empty “Until” means you still live here."
      from: "From"
      until: "Until"
      save: "Save"
      remove: "Remove"
      add: "Add a period"
      end_before_start: "“Until” can't be before “From”."
    # The origin filter on the Trips list. Managed Trips count as created by the user.
    filter:
      label: "Show"
      all: "All trips"
      manual: "Created by me"
      detected: "Found automatically"
    # Hints on the Trips page; each ends with a link to the Places page.
    hints:
      no_home: "Add your Home so Dawarich can find your trips automatically."
      long_absence: "Dawarich skipped a time away from home longer than %{days} days. If you lived somewhere else then, add that earlier Home."
      add_home: "Add a Home on the Places page"
    # The name of the Place created for a Home picked in onboarding.
    home_place_name: "Home"
    # The optional "Add your home" screen of the onboarding modal.
    onboarding:
      title: "Add your home"
      intro: "Dawarich uses your home to find your trips automatically. Share your location or click the map, then confirm."
      use_my_location: "Use my location"
      confirm: "This is my home"
      skip: "Skip"
      location_denied: "Your location could not be read. Click the map to place your home instead, or set it later on the Places page."
      home_saved: "Your home is saved. Dawarich will look for your trips."
      invalid_location: "Pick a location on the map first."
      # Leaves the import screen for the home step (or closes the modal).
      continue: "Continue"
