# config/schedule.yml

bulk_stats_calculating_job:
  cron: "0 */1 * * *" # every 1 hour
  class: "BulkStatsCalculatingJob"
  queue: stats

visit_suggesting_job:
  cron: "5 0 * * *" # every day at 00:05
  class: "BulkVisitsSuggestingJob"
  queue: visit_suggesting

watcher_job:
  cron: "0 */1 * * *" # every 1 hour
  class: "Import::WatcherJob"
  queue: imports

airtrail_flight_import_job:
  cron: "0 2 * * *" # every day at 02:00
  class: "AirTrail::SyncSchedulingJob"
  queue: imports

app_version_checking_job:
  cron: "0 */6 * * *" # every 6 hours
  class: "AppVersionCheckingJob"
  queue: app_version_checking

cache_preheating_job:
  cron: "0 0 * * *" # every day at 0:00
  class: "Cache::PreheatingJob"
  queue: cache

daily_track_generation_job:
  cron: "0 */12 * * *" # every 12 hours (real-time generation handles most cases)
  class: "Tracks::DailyGenerationJob"
  queue: tracks

nightly_reverse_geocoding_job:
  cron: "15 1 * * *" # every day at 01:15
  class: "Points::NightlyReverseGeocodingJob"
  queue: reverse_geocoding

nightly_family_invitations_cleanup_job:
  cron: "30 2 * * *" # every day at 02:30
  class: "Family::Invitations::CleanupJob"
  queue: families

stale_jobs_recovery_job:
  cron: "*/30 * * * *" # every 30 minutes
  class: "StaleJobsRecoveryJob"
  queue: exports

family_location_requests_expiry_job:
  cron: "30 * * * *" # every hour at :30
  class: "Families::ExpireLocationRequestsJob"
  queue: families

points_counter_correction_job:
  cron: "0 */6 * * *" # every 6 hours
  class: "Users::PointsCounterCorrectionJob"
  queue: low_priority

lite_archival_warning_job:
  cron: "0 3 * * *" # every day at 03:00
  class: "Lite::ArchivalWarningJob"
  queue: archival

# Raw data archival pipeline — enable when ready for production use.
# Pipeline: archive (1st) → verify (daily) → clear (8th, 7 days after archive).
# See https://github.com/Freika/dawarich/issues/XXXX for tracking.
raw_data_archive_job:
  cron: "0 3 1 * *" # 1st of month at 03:00
  class: "Points::RawData::ArchiveJob"
  queue: archival

raw_data_verify_job:
  cron: "0 5 * * *" # every day at 05:00
  class: "Points::RawData::VerifyRandomJob"
  queue: archival

raw_data_clear_job:
  cron: "0 3 8 * *" # 8th of month at 03:00 (7 days after archival for verification)
  class: "Points::RawData::ClearJob"
  queue: archival

monthly_digest_scheduling_job:
  cron: "0 4 2 * *" # 2nd of every month at 04:00 UTC
  class: "Users::Digests::Monthly::SchedulingJob"
  queue: digests

yearly_digest_scheduling_job:
  cron: "0 6 2 1 *" # January 2nd at 06:00 UTC
  class: "Users::Digests::Yearly::SchedulingJob"
  queue: digests

pending_imports_cleanup:
  cron: "15 3 * * *" # every day at 03:15 UTC
  class: "PendingImports::CleanupJob"
  queue: low_priority
  description: "Sweep expired or old-claimed pending imports"

route_videos_purge_job:
  cron: "45 3 * * *" # every day at 03:45 UTC
  class: "RouteVideos::PurgeJob"
  queue: route_videos
  description: "Expire stored route videos past the retention window or per-user cap"

points_archival_sweep_job:
  cron: "0 4 * * 0" # every Sunday at 04:00
  class: "Points::Archival::SweepJob"
  queue: archival

points_archival_delete_sweep_job:
  cron: "0 4 * * 3" # every Wednesday at 04:00
  class: "Points::Archival::DeleteSweepJob"
  queue: archival

points_archival_reaper_job:
  cron: "30 4 * * *" # every day at 04:30
  class: "Points::Archival::StuckStateReaperJob"
  queue: archival
